plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tatarhost.cheatlab'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tatarhost.cheatlab'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}


// Use the exact CHEATLAB logo already shipped with the website as the Android launcher icon.
tasks.register('copyCheatlabLauncherIcon', Copy) {
    from("$rootProject.projectDir/../public/assets/logo.png")
    into("$projectDir/src/main/res/drawable-nodpi")
    rename { "cheatlab_logo.png" }
}
tasks.named('preBuild').configure {
    dependsOn('copyCheatlabLauncherIcon')
}
