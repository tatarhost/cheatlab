<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- GitHub Pages serves this project from https://user.github.io/cheatlab/, so
     the app root is a subpath. <base> makes relative assets resolve correctly
     from any depth, and app.js reads it back to prefix its own routes. Deploy
     under a domain root instead? Delete this line. -->
<base href="/cheatlab/">

<title>CHEATLAB — скрипты, пасты, медиа и файлы</title>
<meta name="description" content="CHEATLAB — публикация скриптов, кода, изображений, видео и любых файлов. Анонимно или с аккаунтом, без ограничений по региону.">

<!-- API origin. Empty means same origin, which is what you want when the Worker
     is mounted on the same domain. Set it to the workers.dev URL when the site
     is served from GitHub Pages. `node scripts/set-api-url.mjs <url>` does it. -->
<meta name="cheatlab-api" content="https://cheatlab.tatarhost.workers.dev">

<meta property="og:type" content="website">
<meta property="og:site_name" content="CHEATLAB">
<meta property="og:title" content="CHEATLAB — анонимная публикация скриптов и медиа">
<meta property="og:description" content="Скрипты, код, картинки, видео и любые файлы. Анонимно или с аккаунтом.">
<meta property="og:image" content="https://tatarhost.github.io/cheatlab/og.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="style.css">

<!-- Applied before first paint: without this the page flashes white before
     app.js gets a chance to set the stored preference. -->
<script>
  try {
    var t = localStorage.getItem('cheatlab.theme');
    if (!t) t = 'dark';
    document.documentElement.dataset.theme = t;
    if (t === 'light') {
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', '#ffffff');
    }
  } catch (e) {}
</script>
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m7.5 4.27 9 5.15"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
  <!-- deslop-ignore-next-line 24 Lucide search, ISC -->
  <symbol id="i-search" viewBox="0 0 24 24"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>

  <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>

  <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <!-- deslop-ignore-next-line 24 Lucide moon, ISC -->
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9"/></symbol>
  <!-- deslop-ignore-next-line 24 Lucide sun, ISC -->
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
  <!-- deslop-ignore-next-line 24 Lucide eye, ISC -->
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-term" viewBox="0 0 24 24"><path d="m7 11 2-2-2-2"/><path d="M11 13h4"/><rect width="18" height="18" x="3" y="3" rx="2"/></symbol>
  <symbol id="i-hash" viewBox="0 0 24 24"><path d="M4 9h16"/><path d="M4 15h16"/><path d="M10 3 8 21"/><path d="M16 3l-2 18"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="M11 4h4"/><path d="M11 8h7"/><path d="M11 12h10"/></symbol>
  <!-- deslop-ignore-next-line 24 Lucide image, ISC -->
  <symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></symbol>
  <!-- deslop-ignore-next-line 24 Lucide video, ISC -->
  <symbol id="i-video" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect width="14" height="12" x="2" y="6" rx="2"/></symbol>
  <!-- deslop-ignore-next-line 24 Lucide file, ISC -->
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2v4a2 2 0 0 0 2 2h4"/><path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2z"/></symbol>
</svg>

<div class="app">

  <aside class="rail">
    <a class="brand" href="./">
      <img src="assets/logo.png" alt="" width="40" height="40">
      <span class="brand-name">CHEAT<b>LAB</b></span>
    </a>

    <nav class="nav">
      <a class="nav-link" href="./scripts"><svg class="i"><use href="#i-code"/></svg>Скрипты</a>
      <a class="nav-link" href="./apps"><svg class="i"><use href="#i-box"/></svg>Приложения</a>
      <a class="nav-link" href="./pastes"><svg class="i"><use href="#i-clip"/></svg>Пасты</a>
      <a class="nav-link" href="./images"><svg class="i"><use href="#i-image"/></svg>Изображения</a>
      <a class="nav-link" href="./videos"><svg class="i"><use href="#i-video"/></svg>Видео</a>
      <a class="nav-link" href="./files"><svg class="i"><use href="#i-file"/></svg>Файлы</a>
      <a class="nav-link" href="./me"><svg class="i"><use href="#i-user"/></svg>Мои загрузки</a>
    </nav>

    <!-- Own row rather than inside .rail-foot, which the mobile layout hides:
         signing in has to stay reachable on a phone, not just on a desktop rail. -->
    <div class="rail-account" id="accountSlot"></div>

    <div class="rail-foot">
      <button class="rail-stat theme-toggle" id="themeToggle" type="button" aria-label="Сменить тему">
        <svg class="i" aria-hidden="true"><use href="#i-moon" id="themeIcon"/></svg>
        <span id="themeLabel">Светлая тема</span>
      </button>
      <p class="rail-note" id="railNote">Анонимно доступна одна публикация в сутки. С аккаунтом — четыре, без проверки.</p>
      <a class="rail-stat" href="./stats"><span id="statItems">0</span> публикаций</a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <form class="search" id="searchForm" role="search">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="searchInput" type="search" placeholder="поиск по названию, тегу, коду" autocomplete="off" spellcheck="false">
      </form>
      <div class="topbar-actions">
        <a class="btn btn-primary" href="./new"><svg class="i"><use href="#i-plus"/></svg>Опубликовать</a>
      </div>
    </header>

    <div id="view" class="view"></div>

    <footer class="foot">
      <span>CHEATLAB</span>
      <span id="footStats"></span>
      <a href="#" id="apiLink">API</a>
    </footer>
  </main>

</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js" type="module"></script>
</body>
</html>
