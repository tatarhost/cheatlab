<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b09">
<meta name="referrer" content="no-referrer">
<title>Ключ входа — CHEATLAB</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#080b09;color:#f3f7f4}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#183322 0,#080b09 58%)}
main{width:min(100%,460px);padding:28px;border:1px solid #294333;background:#101713;box-shadow:0 24px 80px #0008}
h1{font-size:30px;line-height:1.08;margin:0 0 12px}p{color:#b4c2b8;line-height:1.55}
button{width:100%;min-height:50px;padding:12px 16px;border:0;background:#8ee8a8;color:#07120b;font-size:15px;font-weight:850;cursor:pointer}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#080f0a;border:1px solid #314b38;padding:14px;user-select:text;color:#a9f2bc;min-height:66px}
small{display:block;color:#9aa99e;line-height:1.5;margin-top:16px}
</style>
</head>
<body><main>
<h1>Ключ входа приложения</h1>
<p>Ключ позволяет начать вход в приложение. После его ввода потребуется подтверждение кодом из письма. Не отправляйте ключ другим людям.</p>
<button id="make">Создать ключ</button>
<pre id="key">Нажмите «Создать ключ».</pre>
<button id="copy" hidden>Скопировать ключ</button>
<small id="status">Сначала войдите в CHEATLAB в этом браузере.</small>
</main>
<script>
(() => {
 const API='https://cheatlab.tatarhost.workers.dev';
 const make=document.getElementById('make'), out=document.getElementById('key'), copy=document.getElementById('copy'), status=document.getElementById('status');
 const auth=()=>{try{const s=JSON.parse(localStorage.getItem('cheatlab.session')||'null');const c=localStorage.getItem('cheatlab.client')||'';return s&&s.token&&/^[A-Za-z0-9_-]{16,64}$/.test(c)?{token:s.token,client:c}:null}catch{return null}};
 let value='';
 make.addEventListener('click',async()=>{
  const a=auth(); if(!a){status.textContent='Откройте CHEATLAB и войдите в аккаунт в этом же браузере.';return}
  make.disabled=true;status.textContent='Создаём ключ…';
  try{
   const r=await fetch(API+'/api/auth/key',{method:'POST',cache:'no-store',headers:{'content-type':'application/json','x-cheatlab-client':a.client,'x-cheatlab-session':a.token},body:'{}'});
   const d=await r.json();if(!r.ok)throw new Error(d.error||('HTTP '+r.status));
   value=d.key||'';out.textContent=value||'Ключ не получен';copy.hidden=!value;status.textContent='Готово. Срок действия — до 90 дней. Сразу скопируйте ключ и храните его в секрете.';
  }catch(e){status.textContent=e.message||'Не удалось создать ключ'}finally{make.disabled=false}
 });
 copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(value);status.textContent='Ключ скопирован'}catch{status.textContent='Выделите ключ и скопируйте вручную'}});
})();
</script>
</body></html>
