name = "cheatlab"
main = "src/guard.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Metadata. SQLite dialect, same schema as the original node:sqlite store.
[[d1_databases]]
binding = "DB"
database_name = "cheatlab"
database_id = "579a8d6f-42d7-42ca-8700-84538742a4b7"
migrations_dir = "migrations"

# Uploaded files, images and video now go to Cloudinary, not to KV. KV stays
# bound as BUCKET because everything uploaded before the Cloudinary migration is
# still there and still has to serve; new bytes never touch it.
#
# Cloudinary is configured with secrets, not with vars, because the upload is
# signed and the secret must not be in the repository. Without all four of these
# the Worker silently falls back to KV, which caps a file at 25 MiB, so a
# half-configured upload would fail on size rather than on configuration. Set
# them once with:
#
#   npx wrangler secret put CLOUDINARY_CLOUD_NAME --config wrangler.toml
#   npx wrangler secret put CLOUDINARY_API_KEY   --config wrangler.toml
#   npx wrangler secret put CLOUDINARY_API_SECRET --config wrangler.toml
#   npx wrangler secret put CLOUDINARY_SALT      --config wrangler.toml
#
# CLOUDINARY_SALT is ours, not Cloudinary's: it makes the public id an HMAC of
# the content digest, so identical bytes still collapse onto one asset while the
# url stays uncomputable from the file. Any random string works. Changing it
# later does not break deleting - the rid is read from the row - but the same
# bytes would then upload to a second asset instead of collapsing onto the
# first, so keep it stable.
[[kv_namespaces]]
binding = "BUCKET"
id = "6394a31d96044562996c00ea83b2f889"

# Live delivery for chats. One room per conversation, addressed by name so the
# Worker and the browser agree on the id without passing one to the other.
#
# A room holds open sockets and nothing else - message bodies are written to D1
# first and the room is only told to hand them on. So a room can never author a
# message, and losing a room costs delivery rather than data.
#
# new_sqlite_classes is the storage backend. It must be a class that did not
# exist when the DO was first deployed; changing the list later on a class that
# already exists is rejected by the platform, which is why the name here matches
# the class in src/room.js exactly.
#
# Hibernation is on, so an empty room costs nothing. The Free plan allows
# SQLite-backed rooms, with limits far above what chat needs - a room is
# addressed by a name rather than per user, so the count follows the number of
# rooms in use, not the number of people signed in.
[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ConversationRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationRoom"]

# Optional TURN relay for calls across restrictive NATs/firewalls.
# Create a Cloudflare Realtime TURN key, then add its values as Worker secrets:
#   npx wrangler secret put CF_TURN_KEY_ID --config .\\wrangler.toml
#   npx wrangler secret put CF_TURN_API_TOKEN --config .\\wrangler.toml
# The API token needs Calls Write permission. The long-lived token stays in
# Worker secrets; browsers receive only short-lived credentials.
# Without these secrets, calls fall back to STUN and may fail across some networks.

[triggers]
crons = ["17 * * * *"]

[vars]
MAX_FILE_MB = "50"
MAX_TEXT_KB = "256"
MAX_FILES = "60"
TITLE_MAX = "120"
LABEL_MAX = "24"
WRITE_CAP = "90"
READ_CAP = "240"
ALLOW_ORIGIN = "*"
SITE_URL = "https://tatarhost.github.io/cheatlab"
DENY_EXT = ""
DENY_SHA = ""
WEBHOOK_URL = ""

POW_BITS = "18"
ANON_NEW_ITEMS_PER_DAY = "1"
REG_NEW_ITEMS_PER_DAY = "12"

# Comma-separated internal user IDs with full admin access.
ADMIN_IDS = "u_cjp5nj6huwag,u_w8nvkv3akeew"

[observability]
enabled = true

[ai]
binding = "AI"
