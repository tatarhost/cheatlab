name = "cheatlab"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Metadata. SQLite dialect, same schema as the original node:sqlite store.
[[d1_databases]]
binding = "DB"
database_name = "cheatlab"
database_id = "579a8d6f-42d7-42ca-8700-84538742a4b7"
migrations_dir = "migrations"

# Uploaded files, images and video now go to Cloudinary, not to KV. KV stays
# bound as BUCKET because everything uploaded before the Cloudinary migration is
# still there and still has to serve; new bytes never touch it.
#
# Cloudinary is configured with secrets, not with vars, because the upload is
# signed and the secret must not be in the repository. Without all four of these
# the Worker silently falls back to KV, which caps a file at 25 MiB, so a
# half-configured upload would fail on size rather than on configuration. Set
# them once with:
#
#   npx wrangler secret put CLOUDINARY_CLOUD_NAME --config wrangler.toml
#   npx wrangler secret put CLOUDINARY_API_KEY   --config wrangler.toml
#   npx wrangler secret put CLOUDINARY_API_SECRET --config wrangler.toml
#   npx wrangler secret put CLOUDINARY_SALT      --config wrangler.toml
#
# CLOUDINARY_SALT is ours, not Cloudinary's: it makes the public id an HMAC of
# the content digest, so identical bytes still collapse onto one asset while the
# url stays uncomputable from the file. Any random string works. Changing it
# later does not break deleting - the rid is read from the row - but the same
# bytes would then upload to a second asset instead of collapsing onto the
# first, so keep it stable.
[[kv_namespaces]]
binding = "BUCKET"
id = "6394a31d96044562996c00ea83b2f889"

[triggers]
crons = ["17 * * * *"]

[vars]
# 50 MB is the largest file the Worker will pull into its own heap and still hand
# on, and Cloudinary's free tier allows 100 MB, so the cap below is a deliberate
# headroom rather than a plan limit.
MAX_FILE_MB = "50"
MAX_TEXT_KB = "256"
MAX_FILES = "60"
TITLE_MAX = "120"
LABEL_MAX = "24"
WRITE_CAP = "90"
READ_CAP = "240"
ALLOW_ORIGIN = "*"
SITE_URL = "https://tatarhost.github.io/cheatlab"
DENY_EXT = ""
DENY_SHA = ""
WEBHOOK_URL = ""

# Anti-abuse tuning. These are the values most likely to change after launch, so
# they live here rather than in source.
#
# POW_BITS is the proof-of-work difficulty in leading zero bits, 8-30. 18 is
# ~260k hashes: a few seconds in a browser, and a bot pays it per throwaway
# account. Do not raise it much - 22 measures 60s+ here, which just makes people
# abandon registration.
POW_BITS = "18"
# Daily item caps. Defaults ship as 1 anonymous / 12 registered.
ANON_NEW_ITEMS_PER_DAY = "1"
REG_NEW_ITEMS_PER_DAY = "12"

# Ids of the accounts that get the admin mark on their profile and posts. It is
# a var rather than a secret on purpose: the flag is public by design (it is in
# every API response) and lives in source, so an empty list is the honest
# default - nobody is an admin until someone is named here. Comma-separated:
#
#   ADMIN_IDS = "tatar506,someoneelse"
#
ADMIN_IDS = "u_cjp5nj6huwag"

# CAPTCHA_SECRET is NOT set here on purpose: it is a secret, not a var. Create
# it once with:
#
#   npx wrangler secret put CAPTCHA_SECRET --config wrangler.toml
#
# Without it the Worker logs a warning and uses a public fallback key, which
# lets a caller mint captcha handles for challenge ids it guesses.

[observability]
enabled = true
