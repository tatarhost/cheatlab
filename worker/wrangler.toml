name = "cheatlab"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Metadata. SQLite dialect, same schema as the original node:sqlite store.
[[d1_databases]]
binding = "DB"
database_name = "cheatlab"
database_id = "579a8d6f-42d7-42ca-8700-84538742a4b7"
migrations_dir = "migrations"

# Uploaded files, images and video. KV keeps the plan card-free: it is part of
# the free Workers tier, while R2 must be enabled in the dashboard with a
# payment method. Max value size is 25 MiB, hence the 24 MB upload cap below.
[[kv_namespaces]]
binding = "BUCKET"
id = "6394a31d96044562996c00ea83b2f889"

[triggers]
crons = ["17 * * * *"]

[vars]
MAX_FILE_MB = "24"
MAX_TEXT_KB = "256"
MAX_FILES = "20"
TITLE_MAX = "120"
LABEL_MAX = "24"
WRITE_CAP = "30"
READ_CAP = "240"
ALLOW_ORIGIN = "*"
SITE_URL = "https://tatarhost.github.io/cheatlab"
DENY_EXT = ""
DENY_SHA = ""
WEBHOOK_URL = ""

[observability]
enabled = true
