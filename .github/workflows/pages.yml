name: Deploy site

# Publishes public/ to GitHub Pages. The API is a Cloudflare Worker deployed
# separately with `wrangler deploy` (see worker/wrangler.toml), so this workflow
# only ships static files.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Pages serves 404.html for paths that do not have a physical file.
      # Keep the committed SPA fallback so deep links continue to work.
      - name: Check application JavaScript syntax
        run: |
          for file in public/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      # A run/attempt-specific name avoids collisions with artifacts left by
      # previous retries of this workflow.
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: cheatlab-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: public
          retention-days: 1

      # The artifact service and the workflow-run REST API can become visible
      # at slightly different times. Verify the exact artifact, then allow the
      # Pages artifact index a short consistency window before deployment.
      - name: Verify Pages artifact is available
        uses: actions/github-script@v7
        env:
          EXPECTED_ARTIFACT_NAME: cheatlab-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const expectedName = process.env.EXPECTED_ARTIFACT_NAME;
            for (let attempt = 1; attempt <= 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              });
              const artifact = data.artifacts.find(
                item => item.name === expectedName && !item.expired
              );
              if (artifact) {
                core.info(`Verified Pages artifact "${artifact.name}" (ID ${artifact.id}, ${artifact.size_in_bytes} bytes).`);
                await new Promise(resolve => setTimeout(resolve, 10000));
                return;
              }
              core.info(`Pages artifact "${expectedName}" is not visible yet (${attempt}/12).`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error(`Pages artifact "${expectedName}" was not found after 60 seconds.`);

      - id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: cheatlab-pages-${{ github.run_id }}-${{ github.run_attempt }}
