name: Deploy site

# Publishes public/ to GitHub Pages. The API is a Cloudflare Worker deployed
# separately with `wrangler deploy` (see worker/wrangler.toml), so this workflow
# only ships static files.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Pages serves 404.html for any path it does not have on disk, and the app
      # is a single page that routes on the client. public/404.html is a committed
      # file that parks the requested path in sessionStorage and hands it to the
      # app, which then takes the address bar back - so a shared link like
      # /cheatlab/i/a1b2c3d4 opens the publication *and* keeps its URL. It used
      # to be generated here by copying index.html over it, which rendered the app
      # but left the address bar on the 404 path and could not be reasoned about
      # from either file.

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
