name: AIL AI continuous resumable training

on:
  push:
    branches: [main]
    paths:
      - "ai/ail-cpu/**"
      - ".github/workflows/ail-cpu-training.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps for this session"
        required: false
        default: "300"
      continuous:
        description: "Request the next training session after this one"
        required: false
        type: boolean
        default: true
  repository_dispatch:
    types: [ail-continue]

permissions:
  contents: write
  actions: read

concurrency:
  group: ail-ai-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore latest resumable checkpoint cache
        uses: actions/cache/restore@v4
        with:
          path: ai/ail-cpu/state
          key: ail-cpu-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ail-cpu-state-${{ runner.os }}-
      - name: Install CPU training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 numpy==1.26.4 pyarrow==18.1.0
      - name: Train AIL from saved state
        env:
          AIL_STEPS: ${{ github.event.inputs.steps || '300' }}
          AIL_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIL_WORKER_URL: https://cheatlab.tatarhost.workers.dev
          GITHUB_SHA: ${{ github.sha }}
        run: python ai/ail-cpu/train.py
      - name: Save resumable checkpoint cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ai/ail-cpu/state
          key: ail-cpu-state-${{ runner.os }}-${{ github.run_id }}
      # Metrics are reported directly to the Worker and stored in D1.
      # Do not commit generated metrics to main: concurrent training runs can
      # conflict with unrelated source commits during git rebase.
      - name: Send completed session to Cloudflare
        id: cloudflare_report
        continue-on-error: true
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIL_WORKER_URL: https://cheatlab.tatarhost.workers.dev
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          with open("artifacts/ail-cpu/model-card.json", encoding="utf-8") as f:
              m=json.load(f)
          payload={
            "run_id":os.environ["GITHUB_RUN_ID"],"status":"session_completed",
            "parameters":m.get("parameters",0),"total_steps":m.get("total_steps",0),
            "session_steps":m.get("session_steps",0),"train_loss":m.get("train_loss"),
            "validation_loss":m.get("validation_loss"),"best_validation_loss":m.get("best_validation_loss"),
            "elapsed_seconds":m.get("elapsed_seconds",0),"compute":"GitHub Actions CPU",
            "initialized_from_random_weights":m.get("initialized_from_random_weights",False),
            "pretrained_model_used":m.get("pretrained_model_used",False),
            "workflow":"AIL AI continuous resumable training","commit":os.environ["GITHUB_SHA"],
            "checkpoint_saved":True,"next_session_requested":True,
            "note":"Checkpoint resumes through GitHub Actions cache; Cloudflare stores session history and completion signal."
          }
          req=urllib.request.Request(os.environ["AIL_WORKER_URL"]+"/api/ail/training/report",
            data=json.dumps(payload).encode(),headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=30) as response:
            print(response.read().decode())
          PY
      - name: Queue next training session
        if: success() && (github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || github.event.inputs.continuous == 'true' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$GH_REPOSITORY/dispatches \
            -d '{"event_type":"ail-continue","client_payload":{"source_run":"${{ github.run_id }}"}}'
      - name: Upload checkpoint and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ail-ai-training-${{ github.run_number }}
          path: artifacts/ail-cpu/
          if-no-files-found: warn
          retention-days: 30
