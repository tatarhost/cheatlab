name: AIL AI CPU training experiment

on:
  push:
    branches: [main]
    paths:
      - "ai/ail-cpu/**"
      - ".github/workflows/ail-cpu-training.yml"
      - "worker/src/**"
      - "public/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps (CPU experiment)"
        required: false
        default: "300"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1
      - name: Train AIL small CPU prototype
        env:
          AIL_STEPS: ${{ github.event.inputs.steps || '300' }}
        run: python ai/ail-cpu/train.py
      - name: Upload model checkpoint and metrics
        uses: actions/upload-artifact@v4
        with:
          name: ail-ai-cpu-experiment
          path: artifacts/ail-cpu/
          if-no-files-found: error
          retention-days: 30
