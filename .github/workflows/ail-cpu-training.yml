name: AIL AI scheduled from-scratch training

on:
  push:
    branches: [main]
    paths:
      - "ai/ail-cpu/**"
      - ".github/workflows/ail-cpu-training.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps for this session"
        required: false
        default: "300"

permissions:
  contents: write

concurrency:
  group: ail-ai-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore AIL checkpoint and dataset cache
        uses: actions/cache/restore@v4
        with:
          path: ai/ail-cpu/state
          key: ail-cpu-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ail-cpu-state-${{ runner.os }}-
      - name: Install CPU training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 numpy==1.26.4 pyarrow==18.1.0
      - name: Train AIL from random initialization
        env:
          AIL_STEPS: ${{ github.event.inputs.steps || '300' }}
        run: python ai/ail-cpu/train.py
      - name: Save resumable checkpoint cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ai/ail-cpu/state
          key: ail-cpu-state-${{ runner.os }}-${{ github.run_id }}
      - name: Publish latest training metrics to CHEATLAB
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ail-training-metrics.json
          git commit -m "Publish AIL training metrics [skip ci]" || exit 0
          git push
      - name: Upload checkpoint and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ail-ai-training-${{ github.run_number }}
          path: artifacts/ail-cpu/
          if-no-files-found: warn
          retention-days: 30
