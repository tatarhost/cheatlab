name: CHEATLAB security regression tests

on:
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/security-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Worker regression suite
        working-directory: worker
        run: npm test
      - name: Run app login and authorization tests
        working-directory: worker
        run: node --experimental-sqlite test/app-login.test.mjs
